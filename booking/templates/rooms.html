<!DOCTYPE html>
<html lang="en">

<head>
  <title>Rooms</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fa;
    }

    .room-card {
      border-radius: 15px;
      transition: 0.3s;
    }

    .room-card:hover {
      transform: translateY(-8px);
    }

    .price {
      color: #ff7b00;
      font-weight: bold;
      font-size: 20px;
    }

    .btn-book {
      background: #1e3c72;
      color: white;
      border-radius: 20px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🏨 HotelBooking</a>

        <div>
            {% if user.is_authenticated %}
                <span class="text-white me-3">Hello, {{ user.username }}</span>
                <a href="/logout/" class="btn btn-danger">Logout</a>
            {% else %}
                <a href="/login/" class="btn btn-light me-2">Login</a>
                <a href="/signup/" class="btn btn-warning">Signup</a>
            {% endif %}
        </div>
    </div>
</nav>

  <div class="container mt-5">
    <h2 class="text-center mb-4">Available Rooms</h2>

    <div class="row">
      {% for room in rooms %}
      <div class="col-md-4 mb-4">
        <div class="card room-card shadow">
          <div class="card-body">
            <h5 class="card-title">Room {{ room.number }}</h5>
            <p class="card-text">Type: {{ room.room_type }}</p>
            <p class="price">₹{{ room.price }}</p>

            <a href="/book/{{ room.id }}/" class="btn btn-book w-100">Book Now</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

</body>

</html>
