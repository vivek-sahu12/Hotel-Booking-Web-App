<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signup</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'DM Sans', sans-serif;
            background-color: #0e0c1a;
            overflow: hidden;
        }

        .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 80% 60% at 30% 60%, #1e0a3c 0%, #0e0c1a 60%); }
        .grid-lines {
            position: fixed; inset: 0; z-index: 1;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.45; animation: drift 8s ease-in-out infinite alternate; z-index: 1; }
        .orb1 { width: 420px; height: 420px; top: -80px; left: -80px; background: #4a0e6e; }
        .orb2 { width: 350px; height: 350px; bottom: -60px; right: -60px; background: #0e2a6e; animation-delay: -3s; }
        @keyframes drift { from { transform: translate(0,0); } to { transform: translate(25px,18px); } }

        .card-wrap {
            position: relative; z-index: 10;
            width: min(400px, calc(100vw - 32px));
            animation: riseUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes riseUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 22px;
            padding: 32px 32px 28px;
            backdrop-filter: blur(24px);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .corner { position: absolute; width: 60px; height: 60px; }
        .corner-tl { top:-1px; left:-1px; border-top:2px solid rgba(232,66,10,0.5); border-left:2px solid rgba(232,66,10,0.5); border-radius:22px 0 0 0; }
        .corner-br { bottom:-1px; right:-1px; border-bottom:2px solid rgba(232,66,10,0.2); border-right:2px solid rgba(232,66,10,0.2); border-radius:0 0 22px 0; }

        .eyebrow {
            font-family: 'Syne', sans-serif; font-size: 10px;
            letter-spacing: 0.15em; text-transform: uppercase; color: #e8420a;
            margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
        }
        .eyebrow::after { content:''; flex:1; height:1px; background:linear-gradient(to right, rgba(232,66,10,0.4), transparent); }
        h1 { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; color:#fff; letter-spacing:-0.02em; margin-bottom:20px; }
        h1 span { color:transparent; -webkit-text-stroke:1px rgba(255,255,255,0.3); }

        .alert {
            background:rgba(232,66,10,0.12); border:1px solid rgba(232,66,10,0.3);
            border-radius:8px; padding:9px 13px; color:#ff7a52; font-size:13px;
            margin-bottom:14px; display:flex; align-items:center; gap:8px;
        }
        .alert::before { content:'⚠'; }

        .field { margin-bottom: 12px; }
        label { display:block; font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:5px; font-family:'Syne',sans-serif; }

        .input-wrap { position:relative; }
        .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.25); pointer-events:none; transition:color 0.2s; }

        input[type="text"], input[type="email"], input[type="password"] {
            width:100%; padding:11px 14px 11px 42px;
            background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
            border-radius:10px; color:#fff; font-size:14px;
            font-family:'DM Sans',sans-serif; outline:none; caret-color:#e8420a;
            transition:border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color:rgba(255,255,255,0.2); }
        input:focus { background:rgba(255,255,255,0.08); border-color:rgba(232,66,10,0.6); box-shadow:0 0 0 3px rgba(232,66,10,0.1); }

        .toggle-password {
            position:absolute; right:12px; top:50%; transform:translateY(-50%);
            background:none; border:none; color:rgba(255,255,255,0.25); cursor:pointer; padding:3px; line-height:1;
            transition:color 0.2s;
        }
        .toggle-password:hover { color:rgba(255,255,255,0.6); }

        .strength-bar { display:flex; gap:3px; margin-top:6px; }
        .s { flex:1; height:2px; border-radius:2px; background:rgba(255,255,255,0.08); transition:background 0.3s; }
        .s.weak { background:#ef4444; } .s.fair { background:#f97316; } .s.good { background:#eab308; } .s.strong { background:#22c55e; }

        .terms-row { display:flex; align-items:center; gap:9px; margin:14px 0; }
        .terms-row input[type="checkbox"] { display:none; }
        .checkmark {
            width:16px; height:16px; flex-shrink:0; border:1.5px solid rgba(255,255,255,0.2);
            border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer;
            transition:all 0.2s;
        }
        .terms-row input:checked ~ .checkmark { background:#e8420a; border-color:#e8420a; }
        .terms-row input:checked ~ .checkmark::after { content:'✓'; font-size:10px; color:white; font-weight:bold; }
        .terms-text { font-size:12px; color:rgba(255,255,255,0.35); }
        .terms-text a { color:rgba(232,66,10,0.8); text-decoration:none; }
        .terms-text a:hover { color:#e8420a; }

        .btn-signup {
            width:100%; padding:13px;
            background:#e8420a; border:none; border-radius:10px;
            color:white; font-size:14px; font-weight:600;
            font-family:'Syne',sans-serif; letter-spacing:0.04em;
            cursor:pointer; position:relative; overflow:hidden;
            transition:transform 0.15s, box-shadow 0.2s;
            box-shadow:0 4px 20px rgba(232,66,10,0.35);
        }
        .btn-signup::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 60%); }
        .btn-signup:hover { transform:translateY(-1px); box-shadow:0 8px 28px rgba(232,66,10,0.45); }
        .btn-text { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:7px; }

        .card-footer { text-align:center; margin-top:16px; font-size:13px; color:rgba(255,255,255,0.3); }
        .card-footer a { color:#e8420a; text-decoration:none; font-weight:500; }
        .card-footer a:hover { opacity:0.75; }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="grid-lines"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card-wrap">
    <div class="card">
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>

        <div class="eyebrow">Get started</div>
        <h1>Create <span>Account</span></h1>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}

            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="username" name="username" placeholder="your_username" required autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="password" name="password" placeholder="Min. 8 characters" required autocomplete="new-password" oninput="checkStrength(this.value)">
                    <button type="button" class="toggle-password" onclick="togglePwd()" aria-label="Show password">
                        <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="strength-bar">
                    <div class="s" id="s1"></div><div class="s" id="s2"></div>
                    <div class="s" id="s3"></div><div class="s" id="s4"></div>
                </div>
            </div>

            <label class="terms-row" for="terms">
                <input type="checkbox" id="terms" required>
                <span class="checkmark"></span>
                <span class="terms-text">I agree to the <a href="/terms/">Terms</a> &amp; <a href="/privacy/">Privacy Policy</a></span>
            </label>

            <button type="submit" class="btn-signup">
                <span class="btn-text">
                    Create Account
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </span>
            </button>
        </form>

        <div class="card-footer">
            Already have an account? <a href="/login/">Sign in</a>
        </div>
    </div>
</div>

<script>
    function togglePwd() {
        const input = document.getElementById('password');
        const icon  = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
        } else {
            input.type = 'password';
            icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        }
    }

    function checkStrength(val) {
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const colors = ['', 'weak', 'fair', 'good', 'strong'];
        [1,2,3,4].forEach(i => {
            const el = document.getElementById('s' + i);
            el.className = 's' + (i <= score ? ' ' + colors[score] : '');
        });
    }
</script>

</body>
</html>
