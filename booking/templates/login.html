<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #0a0a0f;
            --paper: #f5f3ee;
            --accent: #e8420a;
            --accent2: #1a1a2e;
            --muted: #9a9487;
            --border: rgba(10,10,15,0.12);
            --card-bg: rgba(245,243,238,0.92);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            background-color: #0e0c1a;
            overflow: hidden;
            position: relative;
        }

        /* ── Background canvas ── */
        .bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse 80% 60% at 70% 40%, #1e0a3c 0%, #0e0c1a 60%);
        }

        .grid-lines {
            position: fixed; inset: 0; z-index: 1;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.5;
            animation: drift 8s ease-in-out infinite alternate;
            z-index: 1;
        }
        .orb1 { width: 500px; height: 500px; top: -100px; right: -100px; background: #4a0e6e; }
        .orb2 { width: 400px; height: 400px; bottom: -80px; left: -60px; background: #0e2a6e; animation-delay: -3s; }
        .orb3 { width: 200px; height: 200px; top: 50%; left: 30%; background: #e8420a; opacity: 0.15; animation-delay: -5s; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.05); }
        }

        /* ── Floating label badge ── */
        .badge-tag {
            position: fixed; top: 32px; left: 50%; transform: translateX(-50%);
            z-index: 10;
            display: flex; align-items: center; gap: 8px;
            padding: 8px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            color: rgba(255,255,255,0.6);
            font-size: 12px; font-family: 'Syne', sans-serif; letter-spacing: 0.1em; text-transform: uppercase;
            backdrop-filter: blur(12px);
            animation: fadeDown 0.6s ease both;
        }
        .badge-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #e8420a;
            box-shadow: 0 0 8px #e8420a;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Card ── */
        .card-wrap {
            position: relative; z-index: 10;
            width: min(420px, calc(100vw - 32px));
            animation: riseUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes riseUp {
            from { opacity: 0; transform: translateY(32px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 44px 40px 40px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04),
                0 32px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .card-header {
            margin-bottom: 36px;
        }

        .eyebrow {
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #e8420a;
            margin-bottom: 10px;
            display: flex; align-items: center; gap: 8px;
        }
        .eyebrow::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(232,66,10,0.4), transparent);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        h1 span {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.3);
        }

        .subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }

        /* ── Alert ── */
        .alert {
            background: rgba(232,66,10,0.12);
            border: 1px solid rgba(232,66,10,0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #ff7a52;
            font-size: 13.5px;
            margin-bottom: 24px;
            display: flex; align-items: center; gap: 10px;
            animation: shake 0.4s ease;
        }
        .alert::before { content: '⚠'; font-size: 15px; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-4px); }
            40%,80% { transform: translateX(4px); }
        }

        /* ── Form fields ── */
        .field {
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom: 8px;
            font-family: 'Syne', sans-serif;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.25);
            pointer-events: none;
            transition: color 0.2s;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            caret-color: #e8420a;
        }

        input::placeholder { color: rgba(255,255,255,0.2); }

        input:focus {
            background: rgba(255,255,255,0.08);
            border-color: rgba(232,66,10,0.6);
            box-shadow: 0 0 0 3px rgba(232,66,10,0.12);
        }
        input:focus + .input-focus-line { transform: scaleX(1); }
        input:focus ~ .input-icon { color: #e8420a; }

        .toggle-password {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none;
            color: rgba(255,255,255,0.25);
            cursor: pointer; padding: 4px;
            transition: color 0.2s;
            line-height: 1;
        }
        .toggle-password:hover { color: rgba(255,255,255,0.6); }

        /* ── Options row ── */
        .options-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 28px;
            margin-top: 4px;
        }

        .remember {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; color: rgba(255,255,255,0.4);
            font-size: 13px;
        }
        .remember input[type="checkbox"] { display: none; }
        .checkmark {
            width: 16px; height: 16px;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.2s, background 0.2s;
        }
        .remember input:checked ~ .checkmark {
            background: #e8420a; border-color: #e8420a;
        }
        .remember input:checked ~ .checkmark::after {
            content: '✓'; font-size: 10px; color: white; font-weight: bold;
        }

        .forgot { font-size: 13px; color: rgba(255,255,255,0.35); text-decoration: none; transition: color 0.2s; }
        .forgot:hover { color: #e8420a; }

        /* ── Submit button ── */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: #e8420a;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Syne', sans-serif;
            letter-spacing: 0.04em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 24px rgba(232,66,10,0.35);
        }

        .btn-login::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
        }

        .btn-login::after {
            content: '';
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease, opacity 0.4s ease;
            opacity: 0;
        }

        .btn-login:active::after { width: 300px; height: 300px; opacity: 0; }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(232,66,10,0.45); }
        .btn-login:active { transform: translateY(0); }

        .btn-text { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* ── Divider ── */
        .divider {
            display: flex; align-items: center; gap: 14px;
            margin: 26px 0;
            color: rgba(255,255,255,0.2);
            font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
            font-family: 'Syne', sans-serif;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1;
            height: 1px; background: rgba(255,255,255,0.08);
        }

        /* ── Social buttons ── */
        .socials { display: flex; gap: 10px; }

        .btn-social {
            flex: 1; padding: 11px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 7px;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .btn-social:hover {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.2);
            color: white;
        }
        .btn-social svg { flex-shrink: 0; }

        /* ── Footer ── */
        .card-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: rgba(255,255,255,0.3);
        }
        .card-footer a {
            color: #e8420a;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .card-footer a:hover { opacity: 0.75; }

        /* ── Corner decoration ── */
        .corner {
            position: absolute;
            width: 80px; height: 80px;
            border-radius: 4px;
        }
        .corner-tl { top: -1px; left: -1px; border-top: 2px solid rgba(232,66,10,0.5); border-left: 2px solid rgba(232,66,10,0.5); border-radius: 24px 0 0 0; }
        .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid rgba(232,66,10,0.2); border-right: 2px solid rgba(232,66,10,0.2); border-radius: 0 0 24px 0; }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="grid-lines"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="badge-tag">
    <span class="badge-dot"></span>
    Secure Connection
</div>

<div class="card-wrap">
    <div class="card">
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>

        <div class="card-header">
            <div class="eyebrow">Welcome back</div>
            <h1>Sign<span>In</span></h1>
            <p class="subtitle">Enter your credentials to continue</p>
        </div>

        <!-- Django messages block -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="loginForm">
            {% csrf_token %}

            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" name="username" placeholder="your_username" required autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePwd(this)" aria-label="Show password">
                        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="options-row">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Remember me
                </label>
                <a href="/forgot-password/" class="forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">
                <span class="btn-text">
                    Continue
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                    </svg>
                </span>
            </button>
        </form>

        <div class="divider">or continue with</div>

        <div class="socials">
            <button class="btn-social">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Google
            </button>
            <button class="btn-social">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub
            </button>
        </div>

        <div class="card-footer">
            Don't have an account? <a href="/signup/">Create one</a>
        </div>
    </div>
</div>

<script>
    function togglePwd(btn) {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
        } else {
            input.type = 'password';
            icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        }
    }

    // Ripple effect on button
    document.querySelector('.btn-login').addEventListener('click', function(e) {
        const btn = this;
        btn.classList.add('clicked');
        setTimeout(() => btn.classList.remove('clicked'), 400);
    });
</script>

</body>
</html>
